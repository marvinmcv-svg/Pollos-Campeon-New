<!doctype html>
<html lang="es-BO">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#e00217" />
<title>Seguí tu pollo · Pollos Campeón</title>
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap" rel="stylesheet" />
<style>
  :root { --red:#e00217; --red-deep:#870001; --wine:#1f0607; --cream:#fbf5ea; --cream-2:#efe2c6; --paper:#fffaf0; --mustard:#fbce01; --ink:#241011; --green:#1fa855; --wa:#25d366;
    --font-display:"Alfa Slab One",Georgia,serif; --font-body:"DM Sans",system-ui,sans-serif; --ease:cubic-bezier(.2,.8,.2,1); }
  * { box-sizing: border-box; } body { margin:0; font:400 17px/1.55 var(--font-body); color:var(--ink); background:var(--cream); -webkit-font-smoothing:antialiased; }
  a { color: inherit; }
  .top { background: radial-gradient(60% 80% at 80% 30%, rgba(255,120,80,.35), transparent 70%), var(--red); color: var(--cream); padding: 26px 20px 120px; text-align: center; }
  .brand { display:inline-flex; align-items:center; gap:10px; text-decoration:none; } .brand img { width:40px; height:40px; border-radius:10px; box-shadow:0 0 0 2px var(--cream); }
  .brand span { font:400 1.3rem/1 var(--font-display); text-transform:uppercase; }
  h1 { margin: 34px auto 6px; font:400 clamp(2.2rem, 8vw, 3.6rem)/1 var(--font-display); text-transform:uppercase; max-width: 14ch; text-wrap: balance; }
  .sub { margin:0; opacity:.9; }
  .motif { height:34px; background: linear-gradient(var(--red) 0 8px, var(--cream) 8px 12px, var(--red) 12px 16px, var(--cream) 16px 20px, var(--red) 20px 26px, var(--mustard) 26px 34px); }
  .card { position:relative; max-width: 560px; margin: -100px auto 40px; background: var(--paper); border-radius: 24px; padding: 26px; box-shadow: 0 30px 60px -20px rgba(31,6,7,.4); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .code { font:400 1.9rem/1 var(--font-display); color: var(--red); } .no { font-weight:700; opacity:.7; }
  .pill { display:inline-block; padding:5px 12px; border-radius:999px; font-size:.75rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; background:var(--cream-2); }
  .steps { list-style:none; padding:0; margin: 24px 0; display:grid; gap:0; }
  .steps li { position:relative; display:flex; gap:14px; padding: 0 0 20px; }
  .steps li::before { content:""; position:absolute; left:13px; top:28px; bottom:0; width:2px; background: var(--cream-2); }
  .steps li:last-child::before { display:none; }
  .bul { width:28px; height:28px; flex:0 0 28px; border-radius:50%; background: var(--cream-2); display:grid; place-items:center; font-size:.8rem; font-weight:700; color:#8c7b72; position:relative; z-index:1; }
  .done .bul { background: var(--green); color:#fff; } .done::before { background: var(--green) !important; }
  .cur .bul { background: var(--red); color:#fff; animation: pulse 1.6s infinite; }
  .steps b { display:block; } .steps small { opacity:.65; }
  .items { list-style:none; padding:0; margin: 0 0 12px; border-top: 2px dashed var(--cream-2); padding-top: 14px; }
  .items li { display:flex; justify-content:space-between; padding: 3px 0; }
  .total { display:flex; justify-content:space-between; font-weight:700; font-size:1.1rem; border-top: 2px dashed var(--cream-2); padding-top: 10px; }
  .eta { margin: 16px 0 0; padding: 12px 16px; border-radius: 14px; background: #fff6cf; font-weight:600; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; margin-top: 18px; padding: 15px 22px; border-radius: 999px; background: var(--wa); color:#062b14; font-weight:700; text-decoration:none; }
  .btn--ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--red); color: var(--red); }
  .cancel { padding: 14px 16px; border-radius: 14px; background: #fde3e3; color:#8a0b0b; font-weight:600; }
  .muted { opacity:.65; font-size:.85rem; text-align:center; margin-top: 16px; }
  .skel { height: 18px; border-radius: 8px; background: linear-gradient(90deg, var(--cream-2), #fff, var(--cream-2)); background-size: 200% 100%; animation: sh 1.2s infinite; margin: 10px 0; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(224,2,23,.5); } 70% { box-shadow: 0 0 0 10px rgba(224,2,23,0); } 100% { box-shadow: 0 0 0 0 rgba(224,2,23,0); } }
  @keyframes sh { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .cur .bul, .skel { animation: none; } }
  @media (max-width: 600px) { .card { margin: -100px 16px 40px; padding: 20px; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/assets/img/logo.png" width="40" height="40" alt="" /><span>Pollos Campeón</span></a>
  <h1 id="h">Seguí tu pollo</h1>
  <p class="sub" id="sub">Buscando tu pedido…</p>
</header>
<div class="motif" aria-hidden="true"></div>
<main class="card" id="card" aria-live="polite"><div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:50%"></div></main>
<script src="/js/config.js"></script>
<script>
(function () {
  "use strict";
  const CFG = window.CAMPEON_CONFIG || {}, CALL = "59179888975";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => `Bs ${Number(n).toLocaleString("es-BO", { maximumFractionDigits: 2 })}`;
  const hhmm = (d) => new Date(d).toLocaleTimeString("es-BO", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "America/La_Paz" });
  const token = new URLSearchParams(location.search).get("t") || "";
  const card = document.getElementById("card"), H = document.getElementById("h"), SUB = document.getElementById("sub");
  const HEAD = { new: ["¡Recibimos tu pedido!", "La sucursal lo va a confirmar en un ratito."], confirmed: ["¡Pedido confirmado!", "Ya está en la fila de la cocina."],
    preparing: ["Lo estamos preparando", "Manos campeonas trabajando."], cooking: ["En la brasa 🔥", "Tu pollo se está dorando."], ready: ["¡Listo!", "Tu pedido está listo."],
    out_for_delivery: ["En camino 🛵", "Ya salió hacia tu dirección."], delivered: ["¡Buen provecho!", "Gracias por elegir Campeón."], cancelled: ["Pedido cancelado", "Si fue un error, escribinos por WhatsApp."] };
  const LABEL = { new: "Recibido", confirmed: "Confirmado", preparing: "En preparación", cooking: "En la brasa", ready: "Listo", out_for_delivery: "En camino", delivered: "Entregado" };
  let timer = null;
  function notFound() {
    H.textContent = "No encontramos ese pedido"; SUB.textContent = "Revisá el link que te llegó por WhatsApp.";
    card.innerHTML = `<p>Puede que el link esté incompleto. Si necesitás ayuda, escribinos.</p><a class="btn" href="https://wa.me/${CALL}?text=${encodeURIComponent("Hola, quiero consultar por mi pedido")}" target="_blank" rel="noopener">WhatsApp 798-88975</a><a class="btn btn--ghost" href="/">Volver al inicio</a>`;
  }
  async function load() {
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token) || !CFG.supabaseUrl) return notFound();
    try {
      const h = { apikey: CFG.supabaseKey, "Content-Type": "application/json" };
      if (/^eyJ/.test(CFG.supabaseKey)) h.Authorization = `Bearer ${CFG.supabaseKey}`;
      const r = await fetch(`${CFG.supabaseUrl.replace(/\/$/, "")}/rest/v1/rpc/track_order`, { method: "POST", headers: h, body: JSON.stringify({ token }) });
      const d = await r.json();
      if (!r.ok || !d || !d.ok) return notFound();
      render(d);
      if (["delivered", "cancelled"].includes(d.status)) clearInterval(timer);
    } catch { SUB.textContent = "Sin conexión. Reintentamos en unos segundos…"; }
  }
  function render(d) {
    const [t, s] = HEAD[d.status] || HEAD.new;
    H.textContent = t; SUB.textContent = d.first_name ? `${d.first_name}, ${s.charAt(0).toLowerCase()}${s.slice(1)}` : s;
    document.title = `${t} · ${d.code} · Pollos Campeón`;
    const flow = d.service === "delivery" ? ["new", "confirmed", "preparing", "cooking", "ready", "out_for_delivery", "delivered"] : ["new", "confirmed", "preparing", "cooking", "ready", "delivered"];
    const at = {}; (d.events || []).forEach((e) => { at[e.status] = e.at; });
    const curIdx = flow.indexOf(d.status);
    const steps = d.status === "cancelled" ? `<div class="cancel">Pedido cancelado${d.cancel_reason ? `: ${esc(d.cancel_reason)}` : ""}.</div>` :
      `<ol class="steps">${flow.map((st, i) => `<li class="${i < curIdx || (i === curIdx && st === "delivered") ? "done" : i === curIdx ? "cur" : ""}"><span class="bul">${i < curIdx ? "✓" : i + 1}</span><div><b>${LABEL[st]}${st === "ready" && d.service !== "delivery" ? " para recoger" : ""}</b>${at[st] ? `<small>${hhmm(at[st])}</small>` : ""}</div></li>`).join("")}</ol>`;
    const base = d.scheduled_for ? new Date(d.scheduled_for) : new Date(new Date(d.created_at).getTime() + (d.store.prep_minutes || 20) * 60000);
    const eta = !["delivered", "cancelled", "ready", "out_for_delivery"].includes(d.status) ? `<p class="eta">${d.scheduled_for ? "Programado para" : "Listo aproximadamente a las"} ${hhmm(base)}</p>` : "";
    const wa = d.store.whatsapp || CALL;
    card.innerHTML = `<div class="row"><div><div class="code">${esc(d.code)}</div><span class="no">Pedido #${esc(d.order_no)} · ${esc(d.store.name)}</span></div><span class="pill">${d.service === "delivery" ? "Delivery" : "Para recoger"}</span></div>
      ${steps}${eta}
      <ul class="items">${(d.items || []).map((i) => `<li><span>${esc(i.qty)} × ${esc(i.name)}</span></li>`).join("")}</ul>
      <div class="total"><span>Total</span><span>${money(d.total)}${d.service === "delivery" && !Number(d.delivery_fee) ? " + delivery" : ""}</span></div>
      <a class="btn" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent(`Hola, consulto por mi pedido ${d.code}`)}" target="_blank" rel="noopener">Preguntar por el pedido ${esc(d.code)}</a>
      <p class="muted">Se actualiza solo cada 15 segundos.</p>`;
  }
  load(); timer = setInterval(load, 15000);
})();
</script>
</body>
</html>
